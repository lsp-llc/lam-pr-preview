name: one-shot-embed-plates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-shot-embed-plates.yml'
jobs:
  embed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Goodhart, decode plates, embed figures
        run: |
          set -euo pipefail
          git checkout 87857a28938e041096a83ffaafa8ed30c1899e04 -- 27-goodhart.html
          python3 << 'PY'
          import base64, re
          from pathlib import Path

          CSS = (
              "    .plate-figure { margin: 0 0 22px; }\n"
              "    .plate-figure img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }\n"
              "    .plate-figure figcaption { font-family: inherit; font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; color: #8a8f99; margin-top: 8px; }\n"
          )
          jobs = [
              ("27-goodhart.html", "plate-12-painted-target.jpg",
               "Scientific Plate XII: The Painted Target. Commissioned engraving for this site."),
              ("26-memory-bandwidth.html", "plate-02-librarian-corridor.jpg",
               "Scientific Plate II: The Librarian and the Corridor. Commissioned engraving for this site."),
              ("30-joules.html", "plate-01-meter-under-muse.jpg",
               "Scientific Plate I: The Meter under the Muse. Commissioned engraving for this site."),
              ("29-moe-desk.html", "plate-06-guild-hall.jpg",
               "Scientific Plate VI: The Guild Hall. Commissioned engraving for this site."),
              ("28-local-rag.html", "plate-07-reading-room.jpg",
               "Scientific Plate VII: The Reading Room. Commissioned engraving for this site."),
          ]

          for b64 in sorted(Path('.').glob('plate-*.jpg.b64')):
              raw = ''.join(b64.read_text().split())
              out = Path(b64.name[:-4])
              out.write_bytes(base64.b64decode(raw))
              print('decoded', out, out.stat().st_size)
              b64.unlink()

          for name, src, alt in jobs:
              p = Path(name)
              t = p.read_text(encoding='utf-8')
              if '.plate-figure {' not in t:
                  idx = t.rfind('</style>')
                  if idx == -1:
                      raise SystemExit(f'no style in {name}')
                  t = t.replace('</style>', '\n' + CSS + '</style>', 1)
              if 'class="plate-figure"' not in t:
                  fig = (
                      f'<figure class="plate-figure"><img src="{src}" '
                      f'alt="{alt}"><figcaption>Commissioned for this site</figcaption></figure>\n'
                  )
                  t2, n = re.subn(
                      r'(<div class="plate-kicker">.*?</div>\s*)',
                      r'\1      ' + fig,
                      t,
                      count=1,
                      flags=re.S,
                  )
                  if n != 1:
                      raise SystemExit(f'plate-kicker insert failed for {name}: {n}')
                  t = t2
              p.write_text(t, encoding='utf-8')
              print('patched', name, 'len', len(t), 'figure', 'plate-figure' in t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-embed-plates.yml
          git add 27-goodhart.html 26-memory-bandwidth.html 30-joules.html 29-moe-desk.html 28-local-rag.html
          git add plate-*.jpg 2>/dev/null || true
          git add -u
          git status
          git diff --cached --stat
          git commit -m "Restore Goodhart essay and embed commissioned scientific plate figures."
          git push
